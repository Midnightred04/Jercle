# Republishing Jercle after restoring the repository to public visibility.
name: Deploy Jercle to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jercle-pages-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out Jercle
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Jercle static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy Jercle
        id: deployment
        uses: actions/deploy-pages@v4
