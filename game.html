<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090912">
  <title>Snake Game | Jercle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;font-family:Outfit,Arial,sans-serif;background:#090912;color:#f7f3ff}
    *{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100vh;background:linear-gradient(rgba(9,9,18,.55),rgba(9,9,18,.73)),url("./image_a92e7b23.jpg") center center / cover fixed no-repeat,#090912}
    .header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:20px max(5%,calc((100vw - 1150px)/2));border-bottom:1px solid #493052;background:#090912d9}
    .brand{font:700 1.9rem 'Chakra Petch',sans-serif;color:#fff5fe;text-decoration:none;text-shadow:0 0 18px #ff4dba7f}
    nav{display:flex;gap:clamp(10px,2vw,28px);flex-wrap:wrap}nav a{color:#cfc6e2;text-decoration:none;font-size:.9rem}nav a:hover,nav a[aria-current]{color:#46f4fa;text-shadow:0 0 12px #20e8f299}
    main{max-width:740px;margin:48px auto;padding:0 20px;text-align:center}h1{font:700 clamp(2.3rem,6vw,4rem) 'Chakra Petch',sans-serif;margin:0 0 20px}
    h2{font:700 1.5rem 'Chakra Petch',sans-serif;margin:0}.panel,.leaderboard{background:#151328ee;border:1px solid #77518d;border-radius:18px;padding:24px 16px;box-shadow:0 0 30px #ff4dba18}
    .panel{display:grid;place-items:center;gap:16px}canvas{width:min(100%,360px);height:auto;aspect-ratio:1;border:2px solid #20e8f2;border-radius:8px;background:#171429;box-shadow:0 0 16px #20e8f233}
    .score{font:600 1.3rem 'Chakra Petch',sans-serif;margin:0}.status{min-height:1.5em;margin:0;color:#bbb3cf}
    button{font:700 1rem Outfit,sans-serif;cursor:pointer;padding:12px 30px;border-radius:9px;background:#20e8f2;color:#09111a;border:1px solid #80faff;box-shadow:0 0 18px #20e8f244}button:hover:not(:disabled){background:#80faff}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ff4dba;outline-offset:3px}
    .help{color:#b8b0cd;font-size:.9rem;margin:0}.controls{display:grid;grid-template-columns:repeat(3,46px);gap:6px;justify-content:center;margin-top:2px}.controls button{padding:8px;width:46px;min-height:42px;box-shadow:none}.controls [data-dir="up"]{grid-column:2}.controls [data-dir="left"]{grid-column:1}.controls [data-dir="down"]{grid-column:2}.controls [data-dir="right"]{grid-column:3}
    .player-bar{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap}.player-bar strong{color:#20e8f2}.quiet{background:#221b32;color:#fface0;border:1px solid #80618f;box-shadow:none;padding:7px 12px;font-size:.83rem}.quiet:hover{background:#372447!important}
    .name-form{display:grid;gap:10px;width:min(100%,340px)}.name-form input{width:100%;background:#100e20;border:1px solid #77518d;border-radius:9px;padding:12px;color:#fff;font:inherit}.name-form label{font-size:.95rem;color:#dad1e9}.form-error{color:#ff9cc5;font-size:.85rem;min-height:1em;margin:0}
    .leaderboard{margin-top:26px;text-align:left}.board-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.board-heading span{color:#ff4dba;font-size:1.6rem}.rankings{display:grid;gap:8px;list-style:none;padding:0;margin:0}.rankings li{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:10px;padding:13px 14px;border-radius:9px;background:#1c192c}.rankings li:first-child{background:#302337}.rank-num{font:700 1.1rem 'Chakra Petch',sans-serif;color:#c8adc9}.rankings li:first-child .rank-num{color:#ffd166}.rankings li:nth-child(2) .rank-num{color:#a8f1ff}.rankings li:nth-child(3) .rank-num{color:#ff94d6}.rank-name{overflow-wrap:anywhere}.rank-score{color:#20e8f2;font:700 1.2rem 'Chakra Petch',sans-serif}.board-message{color:#b8b0cd;margin:10px 0 0}.note{color:#a69fbc;font-size:.8rem;line-height:1.5;margin:16px 0 0}footer{text-align:center;color:#8f8aa5;padding:30px;font-size:.75rem;letter-spacing:.1em}
    @media(max-width:600px){main{margin:28px auto}.panel,.leaderboard{padding:18px 12px}.rankings li{padding:12px 10px}}
  </style>
</head>
<body>
  <header class="header"><a class="brand" href="./index.html#home">Jercle.</a><nav aria-label="Navigation"><a href="./index.html#home">Home</a><a href="./index.html#hangouts">Hangouts</a><a href="./index.html#memories">Memories</a><a href="./index.html#brainstorm">Brainstorm</a><a href="./game.html" aria-current="page">Snake Game</a></nav></header>
  <main>
    <h1>Snake Game</h1>
    <section class="panel" aria-label="Snake game">
      <div id="name-form" class="name-form" hidden>
        <label for="player-name">Enter your name to join the leaderboard</label>
        <input id="player-name" maxlength="24" autocomplete="nickname" placeholder="Your player name">
        <button id="save-name" type="button">Continue</button>
        <p id="name-error" class="form-error" role="status"></p>
      </div>
      <div id="player-bar" class="player-bar" hidden>Playing as <strong id="display-name"></strong><button id="change-name" class="quiet" type="button">Change name</button></div>
      <canvas id="game" width="300" height="300" aria-label="Snake game board"></canvas>
      <p id="score" class="score" aria-live="polite">Score: 0</p>
      <p id="status" class="status" aria-live="polite">Enter your name to start</p>
      <button id="play" type="button" disabled>Play</button>
      <p class="help">Use the arrow keys or the on-screen arrows.</p>
      <div class="controls" aria-label="Direction controls"><button type="button" data-dir="up" aria-label="Up">↑</button><button type="button" data-dir="left" aria-label="Left">←</button><button type="button" data-dir="down" aria-label="Down">↓</button><button type="button" data-dir="right" aria-label="Right">→</button></div>
    </section>
    <section class="leaderboard" aria-labelledby="leaderboard-title">
      <div class="board-heading"><h2 id="leaderboard-title">Snake Leaderboard</h2><span aria-hidden="true"></span></div>
      <ol id="rankings" class="rankings"></ol>
      <p id="board-message" class="board-message" role="status">Connecting to leaderboard…</p>
      <p class="note">Top 10 bests.</p>
    </section>
  </main>
  <footer>jercle website</footer>
  <script type="module">
    import {firebaseConfig} from './firebase-config.js';
    import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
    import {getAuth,signInAnonymously,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
    import {getFirestore,collection,doc,onSnapshot,runTransaction,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';

    const $=id=>document.getElementById(id);
    const canvas=$('game'),ctx=canvas.getContext('2d'),scoreEl=$('score'),statusEl=$('status'),playBtn=$('play');
    const grid=15,cell=20;let snake=[[7,7]],food=[3,3],direction=[1,0],nextDirection=[1,0],score=0,timer=null,running=false,changedThisTick=false;
    let playerName='',user=null,db=null,unsubscribeBoard=null;
    const nameKey='jercle-snake-name-v1';
    const images={};
    for(const [key,path] of Object.entries({background:'WhatsApp Image 2026-10-28 at 17.15.47.jpeg',snake:'Subject.png',food:'Subject 2.png'})){
      const img=new Image();img.onload=draw;img.onerror=draw;img.src='./'+encodeURIComponent(path);images[key]=img;
    }
    const ready=img=>img&&img.complete&&img.naturalWidth>0;
    function spawnFood(){const available=[];for(let y=0;y<grid;y++)for(let x=0;x<grid;x++)if(!snake.some(p=>p[0]===x&&p[1]===y))available.push([x,y]);return available.length?available[Math.floor(Math.random()*available.length)]:null;}
    function draw(){ctx.clearRect(0,0,300,300);if(ready(images.background))ctx.drawImage(images.background,0,0,300,300);else{ctx.fillStyle='#181429';ctx.fillRect(0,0,300,300);}snake.forEach(([x,y])=>{if(ready(images.snake))ctx.drawImage(images.snake,x*cell,y*cell,cell,cell);else{ctx.fillStyle='#20e8f2';ctx.fillRect(x*cell+1,y*cell+1,cell-2,cell-2);}});if(food){if(ready(images.food))ctx.drawImage(images.food,food[0]*cell,food[1]*cell,cell,cell);else{ctx.fillStyle='#ff4dba';ctx.fillRect(food[0]*cell+2,food[1]*cell+2,cell-4,cell-4);}}scoreEl.textContent='Score: '+score;}
    function nameUI(){const has=Boolean(playerName);$('name-form').hidden=has;$('player-bar').hidden=!has;$('display-name').textContent=playerName;playBtn.disabled=!has;}
    function setName(){const name=$('player-name').value.trim().replace(/\s+/g,' ');if(!name||name.length>24){$('name-error').textContent='Enter a name of 1–24 characters.';return;}playerName=name;localStorage.setItem(nameKey,name);$('name-error').textContent='';nameUI();statusEl.textContent='Press Play to start';}
    $('save-name').addEventListener('click',setName);
    $('player-name').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();setName();}});
    $('change-name').addEventListener('click',()=>{if(running){statusEl.textContent='Finish your round before changing name.';return;}$('player-name').value=playerName;playerName='';nameUI();$('player-name').focus();});
    try{playerName=localStorage.getItem(nameKey)||'';}catch(e){console.warn('Browser storage unavailable:',e);}
    $('player-name').value=playerName;nameUI();
    if(playerName)statusEl.textContent='Press Play to start';

    async function savePersonalBest(finalScore){
      if(!user||!db||!playerName||finalScore<=0)return;
      const ref=doc(db,'snakeScores',user.uid);
      try{
        await runTransaction(db,async tx=>{
          const existing=await tx.get(ref);
          const old=existing.exists()?existing.data().score:0;
          if(finalScore>old){
            const data={name:playerName,score:finalScore,updatedAt:serverTimestamp()};
            if(existing.exists())tx.update(ref,data);else tx.set(ref,data);
          }
        });
      }catch(err){console.error('Leaderboard save failed',err);statusEl.textContent+=' · Score could not be saved.';}
    }
    function displayBoard(items){const ol=$('rankings');ol.replaceChildren();const top=items.sort((a,b)=>b.score-a.score).slice(0,10);for(const [i,item] of top.entries()){
      const li=document.createElement('li'),rank=document.createElement('span'),name=document.createElement('span'),value=document.createElement('span');
      rank.className='rank-num';rank.textContent=String(i+1).padStart(2,'0');name.className='rank-name';name.textContent=item.name;value.className='rank-score';value.textContent=item.score;li.append(rank,name,value);ol.append(li);
    }$('board-message').textContent=top.length?'':'No high scores yet. Be the first!';}
    async function connectLeaderboard(){
      try{
        const app=initializeApp(firebaseConfig);db=getFirestore(app);const auth=getAuth(app);
        onAuthStateChanged(auth,async account=>{
          if(account){user=account;if(unsubscribeBoard)unsubscribeBoard();unsubscribeBoard=onSnapshot(collection(db,'snakeScores'),snap=>{displayBoard(snap.docs.map(d=>d.data()).filter(d=>typeof d.name==='string'&&Number.isInteger(d.score)));},err=>{$('board-message').textContent='Could not load leaderboard. Check Firestore rules.';console.error(err);});}
          else{try{await signInAnonymously(auth);}catch(err){console.error(err);$('board-message').textContent='Leaderboard unavailable. Enable Anonymous sign-in in Firebase.';}}
        });
      }catch(err){console.error(err);$('board-message').textContent='Leaderboard unavailable. Check Firebase config.';}
    }
    function stop(message){running=false;clearInterval(timer);timer=null;statusEl.textContent=message;playBtn.textContent='Play Again';void savePersonalBest(score);}
    function reset(){if(!playerName)return;clearInterval(timer);snake=[[7,7]];direction=[1,0];nextDirection=[1,0];changedThisTick=false;score=0;food=spawnFood();running=true;statusEl.textContent='Playing';playBtn.textContent='Restart';draw();timer=setInterval(tick,180);}
    function tick(){direction=nextDirection;changedThisTick=false;const head=[snake[0][0]+direction[0],snake[0][1]+direction[1]],eating=!!food&&head[0]===food[0]&&head[1]===food[1],body=eating?snake:snake.slice(0,-1);if(head.some(v=>v<0||v>=grid)||body.some(p=>p[0]===head[0]&&p[1]===head[1])){draw();stop('Game over! Score: '+score);return;}snake.unshift(head);if(eating){score++;food=spawnFood();if(!food){draw();stop('You win!');return;}}else snake.pop();draw();}
    function turn(dx,dy){if(!running||changedThisTick)return;if(dx===-direction[0]&&dy===-direction[1])return;nextDirection=[dx,dy];changedThisTick=true;}
    const arrows={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
    document.addEventListener('keydown',e=>{if(arrows[e.key]&&e.target.tagName!=='INPUT'){e.preventDefault();turn(...arrows[e.key]);}});
    document.querySelectorAll('[data-dir]').forEach(button=>button.addEventListener('click',()=>{const dir={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};turn(...dir[button.dataset.dir]);}));
    playBtn.addEventListener('click',reset);draw();void connectLeaderboard();
  </script>
</body>
</html>
